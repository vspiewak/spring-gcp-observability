# The local loop, no Google Cloud : `docker compose up -d`
services:
  # orders-api's database, for its `local` profile
  mongo:
    image: "mongo:8.0"
    ports:
      - "27017:27017"
  # traces : the UI at http://localhost:16686
  jaeger:
    image: "jaegertracing/jaeger:2.21.0"
    ports:
      - "16686:16686" # the UI
      - "4318:4318"   # OTLP over HTTP, where the services export
