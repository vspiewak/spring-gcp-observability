---
management:
  opentelemetry:
    tracing:
      # decide on the trace id alone : Cloud Run flags most requests "not sampled", and Boot's
      # parent-based default would drop them
      sampler: "trace-id-ratio"
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true
  otlp:
    metrics:
      export:
        # the OpenTelemetry starter ships an OTLP metrics registry too : this demo is about traces and logs
        enabled: false
