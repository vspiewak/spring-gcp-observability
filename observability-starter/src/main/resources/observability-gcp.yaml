# on Google Cloud : traces to the OpenTelemetry Collector beside the service, logs as JSON lines for
# Cloud Logging
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          # the collector's OTLP receiver, in the same Cloud Run instance : it files the spans under
          # the project and signs them to Cloud Trace — terraform/collector.yaml
          endpoint: "http://localhost:4318/v1/traces"
logging:
  structured:
    format:
      console: "logstash"
